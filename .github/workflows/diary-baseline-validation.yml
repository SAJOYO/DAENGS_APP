name: diary-baseline-validation

on:
  push:
    branches:
      - chore/diary-baseline-validation

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
