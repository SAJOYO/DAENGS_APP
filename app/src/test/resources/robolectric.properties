# Robolectric 이 띄우는 Application. 기본값은 매니페스트의 DaengsApp 인데, 거기서
# KakaoSdk.init 이 앱 서명으로 키 해시를 만들다 IllegalStateException 을 던진다 —
# Robolectric 에는 서명이 없다. local.properties 에 카카오 키가 없는 PC 에서는 그 줄을
# 건너뛰어 통과하고, 키가 있는 PC 에서만 깨져서 사람마다 결과가 달랐다.
# 단위 테스트가 보는 건 화면·DB·Intent 지 앱 초기화가 아니라 맨 Application 을 쓴다.
# 클래스마다 @Config(application = Application::class) 를 다는 대신 여기 한 번만 둔다.
application=android.app.Application
