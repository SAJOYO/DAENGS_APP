// Build ONLY assembleDebugAndroidTest. Reuse the installed signed-in development app unchanged.
allprojects { project ->
    project.plugins.withId('com.android.application') {
        project.androidComponents.finalizeDsl { android ->
            android.buildTypes.debug.applicationIdSuffix = '.devtest'
            android.sourceSets.androidTest.kotlin.srcDir(project.rootProject.file('tools/walk-measurement-live-read/tests'))
        }
    }
}
